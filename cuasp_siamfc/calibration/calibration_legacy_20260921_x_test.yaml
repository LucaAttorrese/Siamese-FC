%YAML 1.2
---
# calibration/calibration_legacy_20260921_x_test.yaml -- TEST-ONLY artifact,
# not part of the real calibration/boresight.yaml promotion pipeline.
#
# Identical to calibration/calibration_legacy_20260921.yaml (the 2026-09-21
# intrinsics, fx/fy~24119/24482, R_lc=identity) EXCEPT for t_lc_m.x, which
# here is set to -0.05 m (operator-tuned value, 2026-09-23; an initial
# +0.05 m guess based on "laser 5cm to the left of camera" was flipped to
# -0.05 m on operator request).
#
# Sign reference: t_lc_m is the camera's own origin expressed in the laser
# frame (p_L = R_lc*p_C + t_lc_m; see calibration/roughtest/boresight.yaml's
# header comment), in the same X-right/Y-down/Z-forward convention as
# control/suncubes/camera.py's _point_c_to_laser/_angles_from_point_laser
# (az = atan2(x, z) -- positive x is to the right, confirmed against real
# hardware in control/README.md's 2026-09-17 axis-sign test: a target
# right-of-center produced positive raw azimuth error). By that convention,
# t_lc_m.x=-0.05 encodes "camera 5cm to the LEFT of the laser" (equivalently,
# "laser 5cm to the right of camera") -- mirroring how the existing,
# hand-measured t_lc_m.y=-0.18 encodes "camera 18cm ABOVE the laser"
# (Y-down: "above" is more-negative Y).
# t_lc_m.y (-0.18) and t_lc_m.z (0, unmeasured) and R_lc (identity, no
# rotation -- the earlier 0.4443deg rotation test was reverted at the
# operator's request) are otherwise unchanged from calibration_legacy_20260921.yaml.
#
# This file exists only so control/cuasp.py could be pointed at it for one
# specific test run. It does NOT replace calibration/boresight.yaml -- that
# file still holds t_lc_m=(0,-0.18,0); nothing here promotes this 5cm lateral
# guess into the real calibration artifact. Delete or ignore this file once
# the test is done.
