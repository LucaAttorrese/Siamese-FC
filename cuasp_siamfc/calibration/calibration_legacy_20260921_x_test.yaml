pixel_format: Mono8
extrinsics_source: "hand-tuned test value (t_lc_m.x=-0.05, operator request 2026-09-23) + boresight.yaml (t_lc_m.y only)"
intrinsics_source_file: "calibration_intrinsics.yaml"
intrinsics_software_version: "2026-09-10-camera-intrinsic-calibration-v1"
intrinsics_generated_utc: "2026-09-17T14:35:41.501Z"
training_global_rms_px: 0.88843696029371044
validation_median_view_rmse_px: 0.46302394659318147
validation_p95_view_rmse_px: 1.4095637279290718
image_width: 2040 #nb: from datasheet should be 2064x1552; according to claude we're aquiring at 2592x1944
image_height: 1536
camera_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 24119.407724059725, 0., 1139.7645920257792, 0.,
       24481.978685713217, 586.84194501631839, 0., 0., 1. ]
dist_coeffs: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [ 0.60972346287636325, 0., 0., 0., 0. ]
aruco_dict_name: DICT_4X4_100
marker_size_m: 0.050000000000000003
target_marker_ids: !!opencv-nd-matrix
   sizes: [ 2 ]
   dt: i
   data: [ 1, 2 ]
R_lc: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1., 0., 0., 0., 1., 0., 0., 0., 1. ]
t_lc_m: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [ -0.16, -0.20, 0. ]

