[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuasp"
version = "0.1.0"
description = "C-UASP Python runtime: camera vision pipeline, PCMM/KAS motor transport, and system supervisor."
requires-python = ">=3.10"
# Exact tested versions are not yet pinned; see README.md "Known integration
# gaps" / AGENTS.md SS15 for the tracked gap. CI (.github/workflows/tests.yml)
# now gives at least one continuously-verified (Linux, latest-3.x) combination.
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "PyYAML",
]
# Not listed here: the vendor IDS peak Python SDK (ids_peak / ids_peak_ipl),
# which is installed from the camera manufacturer's own installer, not PyPI.
# Tests never import it directly -- see tests/README or the "out of scope"
# section of the tests gap plan.
# cuasp_siamfc (2026-11-11): the bindings ARE on PyPI; on the training PC
# (IDS peak SDK 26.06.1): pip install ids_peak==1.17.0 ids_peak_ipl==1.18.0
# (see the "ids" extra below). The SDK runtime itself still comes from the IDS installer.

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
# Only needed for calibration/camera_calibration.py's offline validation
# plots (calibration/validation/report/*.png); the calibration solve itself
# only needs the base numpy/opencv-contrib-python/PyYAML dependencies above.
calibration = [
    "matplotlib",
]
# SiamFC tracking source (cuasp_siamfc). torch is installed from the CUDA
# wheel index: pip install torch --index-url https://download.pytorch.org/whl/cu130
# (cu126 is enough for Ada/RTX 40xx but does not run on Blackwell/RTX 50xx).
# Tested: torch 2.14.1+cu126, Python 3.13.3, Windows 11, RTX 4060 Laptop;
#         torch 2.14.1+cu130, Python 3.13.17, Windows 11, RTX 5060 Laptop.
# On Windows use Python >= 3.13: 3.12 has a 16 ms time.monotonic() step.
# scipy is only needed by the offline converter (suncubes.siamfc.convert_matconvnet).
# ultralytics runs the drone detector (AGPL-3.0, accepted for validation; see README).
# Install torch and torchvision from the CUDA index BEFORE ultralytics (README §3).
# Since 2026-11-10 settings.CV_TARGET_TRACKER defaults to "siamfc": cuasp.py needs this extra.
siamfc = [
    "torch",
    "torchvision",
    "scipy",
    "ultralytics",
]
# Live IDS camera (cuasp.py, tools/record_ids.py). Versions validated against the IDS
# peak SDK 26.06.1 installed on the training PC (2026-11-11).
ids = [
    "ids_peak==1.17.0",
    "ids_peak_ipl==1.18.0",
]

[tool.setuptools]
package-dir = {"" = "control"}

[tool.setuptools.packages.find]
where = ["control"]
include = ["suncubes*"]

[tool.pytest.ini_options]
# Lets every test just `import suncubes` / `import suncubes.camera` without
# each file repeating the sys.path.insert() boilerplate `cuasp.py` itself
# needs (see tests/conftest.py for the analogous helper for cuasp.py, which
# is a script rather than a package member).
pythonpath = ["control"]
testpaths = ["tests"]
asyncio_mode = "auto"
